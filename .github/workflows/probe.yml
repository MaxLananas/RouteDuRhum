name: Probe tracker
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/geo/probe.mjs'
      - 'tools/geo/hwx.mjs'
      - '.github/workflows/probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe
        run: node tools/geo/probe.mjs 2>&1 | tee tmp_probe.log
      - name: Show log in job summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -c 60000 tmp_probe.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload decoded samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-decoded
          path: tmp/probe/*
          if-no-files-found: ignore
          retention-days: 2
      - name: Commit probe log
        if: always()
        run: |
          mkdir -p data/diagnostics
          { echo "# Probe $(date -u +%FT%TZ)"; echo; echo '```'; head -c 200000 tmp_probe.log; echo '```'; } > data/diagnostics/probe-latest.md
          git config user.name 'rdr-bot'
          git config user.email 'rdr-bot@users.noreply.github.com'
          git add data/diagnostics/probe-latest.md
          git commit -m 'chore: tracker probe log' || true
          git push || true
