name: Collect Route du Rhum data

on:
  push:
    branches: ['arena/e3d3aa8e-routedurhum', main]
    paths:
      - 'tools/**'
      - '.github/workflows/collect.yml'
      - 'data/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: rdr-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch == 'main' && 'main' || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node tools/collect.mjs --inspect 2>&1 | tee collect.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-log
          path: collect.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit data
        if: always()
        run: |
          set -e
          git config user.name 'rdr-bot'
          git config user.email 'rdr-bot@users.noreply.github.com'
          # never commit the decoded cache
          rm -f data/.cache_*
          git add -A data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: tracker update $(date -u +%FT%TZ) [skip ci]"
            # a scheduled run can overlap a push: rebase and retry a few times
            for i in 1 2 3 4 5; do
              if git push; then echo pushed; break; fi
              sleep 5
              git pull --rebase --autostash || true
            done
          fi
